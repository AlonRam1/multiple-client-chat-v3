syntax = "proto3";
package Chat;

message UserMessage {
  string user = 1;
  string text = 2;
}

message UserListRequest{
  repeated string excluded_users = 1;
}

message UserList{
  repeated string usernames = 1;
}

service ChatService {
  rpc SendUserMessage (stream UserMessage) returns (stream UserMessage);
  rpc SendUserList (UserListRequest) returns (UserList);
}
